[package]
name = "ks89-register"
version = "3.0.1"
edition = "2024"
resolver = "3"

[[bin]]
name = "register"
path = "src/main.rs"

[lib]
name = "register"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dependencies]
rocket = { version = "^0.5.1", features = ["uuid", "secrets", "json"] }
mongodb = "^3.7.0"
uuid ={ version = "^1.23.4", features = ["v4", "fast-rng", "macro-diagnostics"] }
hmac = "^0.13.0"
sha2 = "^0.11.0"
base64 = "^0.22.1"
aes-gcm = "^0.11.0"
# error handling
thiserror = "^2.0.18"
# logger
tracing = "^0.1.44"
tracing-appender = "^0.2.5"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
# env vars
dotenvy = "^0.15.7"
envy = "^0.4.2"

# To use Serialize and Deserialize traits, you must include Serde.
# The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.150"

[dev-dependencies]
rand = "^0.10.1"
# better looking rust assertions
pretty_assertions = "^1.4.1"
# include also serde_json with the feature 'preserve_order' to don't change the order of keys
# 'preserve_order' is required to compare results in a predictible way in testing
serde_json = { version = "^1.0.150", features = ["preserve_order"] }
test-log = { version = "^0.2.21", features = ["trace"] }